services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: claimresolve-backend
    runtime: python
    region: oregon
    plan: standard
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: claimresolve-postgres
          property: connectionString
      - key: LLM_PROVIDER
        value: mock # Change to "openai" in Render Dashboard if adding OPENAI_API_KEY
      - key: EMBEDDING_PROVIDER
        value: mock # Change to "openai" in Render Dashboard if adding OPENAI_API_KEY
      - key: OPENAI_API_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000,https://claimresolve-frontend.onrender.com"

  # ----------------------------------------------------------------------------
  # 2. React 19 Frontend Web App (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: claimresolve-frontend
    runtime: static
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: claimresolve-backend
          property: host

# ------------------------------------------------------------------------------
# 3. Managed PostgreSQL 16 Database with pgvector
# ------------------------------------------------------------------------------
databases:
  - name: claimresolve-postgres
    plan: standard
    region: oregon
    postgresMajorVersion: 16
